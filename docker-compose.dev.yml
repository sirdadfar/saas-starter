services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: saas_starter}
    ports: ["5432:5432"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["8025:8025"]