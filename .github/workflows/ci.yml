name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: saas_starter}
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_starter?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      CORS_ORIGINS: http://localhost:3000
      MAIL_DRIVER: console
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: actions/setup-node@v6
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @saas/api prisma:generate
      - run: pnpm --filter @saas/api prisma:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build